<!DOCTYPE html>
<html lang="de" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Krisztina Racz | Portfolio & Bewerbung{% endblock %}</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Zentrale Custom CSS Datei -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="font-sans antialiased selection:bg-pink-600 selection:text-white">

    <!-- Navigation Bar -->
    <nav class="fixed top-0 left-0 w-full z-50 glass-card border-b border-white/10 px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="{{ url_for('home') }}" class="font-mono text-xl font-bold tracking-wider text-white flex items-center gap-2">
                <span class="text-[var(--brand-cyan)]">&lt;</span>KR<span class="text-[var(--brand-pink)]">/&gt;</span>
                <span class="text-xs px-2 py-0.5 rounded bg-pink-500/20 text-pink-400 border border-pink-500/30">DEV</span>
            </a>

            <!-- Desktop Navigation Links -->
            <div class="hidden md:flex space-x-6 text-sm font-medium items-center">
<!--                <a href="{{ url_for('home') }}" class="hover:text-[var(&#45;&#45;brand-pink)] transition-colors">Über Mich</a>-->
                <a href="{{ url_for('kopf_fit') }}" class="hover:text-[var(--brand-cyan)] transition-colors">KopfFit</a>
                <a href="{{ url_for('jumpnova') }}" class="hover:text-[var(--brand-violet)] transition-colors">JumpNova</a>
                <a href="{{ url_for('warum_ihr') }}" class="text-[var(--brand-pink)] border border-pink-500/40 px-3 py-1 rounded-full bg-pink-500/10 hover:bg-[var(--brand-pink)] hover:text-white transition-all">Warum Ihr Team?</a>
            </div>

            <!-- Action Buttons: Lebenslauf & Anschreiben -->
            <div class="hidden sm:flex items-center gap-3">
                <a href="{{ url_for('cv') }}" class="px-3.5 py-2 text-xs font-semibold tracking-wider rounded-lg bg-gradient-to-r from-[var(--brand-pink)] to-[var(--brand-cyan)] text-black font-bold hover:shadow-[0_0_20px_rgba(247,37,133,0.6)] transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-address-card"></i> Lebenslauf
                </a>
                <a href="{{ url_for('anschreiben') }}" class="px-3.5 py-2 text-xs font-semibold tracking-wider rounded-lg glass-card text-white border border-cyan-400/40 hover:border-[var(--brand-cyan)] hover:bg-white/10 transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-envelope-open-text text-[var(--brand-cyan)]"></i> Anschreiben
                </a>
            </div>

            <!-- Mobile Toggle -->
            <button id="mobile-menu-btn" class="md:hidden text-gray-300 hover:text-white text-xl">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>

        <!-- navigation menu -->
        <div id="mobile-menu" class="hidden md:hidden pt-4 pb-2 border-t border-white/10 mt-3 flex flex-col gap-3 text-sm">
            <a href="{{ url_for('kopf_fit') }}" class="mobile-link px-2 py-1 hover:text-[var(--brand-cyan)]">KopfFit</a>
            <a href="{{ url_for('jumpnova') }}" class="mobile-link px-2 py-1 hover:text-[var(--brand-violet)]">JumpNova</a>
            <a href="{{ url_for('warum_ihr') }}" class="mobile-link px-2 py-1 text-[var(--brand-pink)]">Warum Ihr Team?</a>
            <div class="flex flex-col gap-2 pt-2 border-t border-white/10">
                <a href="{{ url_for('cv') }}" class="mobile-link px-2 py-1 text-[var(--brand-pink)] font-bold flex items-center gap-2"><i class="fa-solid fa-address-card"></i> Lebenslauf ansehen</a>
                <a href="{{ url_for('anschreiben') }}" class="mobile-link px-2 py-1 text-[var(--brand-cyan)] font-bold flex items-center gap-2"><i class="fa-solid fa-envelope-open-text"></i> Anschreiben ansehen</a>
            </div>
        </div>
    </nav>

    <!-- mainocntent -->
    <main class="min-h-screen pt-20">
        {% block content %}{% endblock %}
    </main>
<!-- footer -->
<footer class="py-8 px-6 text-center border-t border-white/10 text-xs font-mono text-gray-400 bg-black/60">
    <p>
        © 2026 Krisztina Racz | Entwickelt mit Python & Flask |
        <a href="{{ url_for('impressum') }}" class="hover:text-[var(--brand-cyan)] underline">Impressum</a> |
        <a href="{{ url_for('datenschutz') }}" class="hover:text-[var(--brand-pink)] underline">Datenschutz</a>|
        <a href="{{ url_for('berry') }}" class="hover:text-[var(--brand-cyan)] underline">🐾Feel-Good-Manager Berry kennenlernen</a>
    </p>
    </p>
</footer>
    <script>
        const mobileBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        mobileBtn.addEventListener('click', () => mobileMenu.classList.toggle('hidden'));
    </script>
</body>
</html>
