{% extends 'base.html' %}

{% block content %}
<section class="py-16 px-6 max-w-5xl mx-auto">
    <div class="text-center mb-12">
        <span class="text-xs font-mono px-3 py-1 rounded-full bg-brand-cyan/10 text-brand-cyan border border-brand-cyan/30">Interactive Web App</span>
        <h1 class="text-4xl font-extrabold text-white mt-4 mb-2">Projekt: <span class="text-brand-cyan">KopfFit</span> 🧠</h1>
        <p class="text-gray-300 text-sm max-w-2xl mx-auto">Interaktive Quiz-Anwendung zur kognitiven Förderung mit direktem visuellen Feedback[cite: 4].</p>
    </div>

    <!-- Video Showcase -->
    <div class="glass-card p-6 rounded-2xl border border-brand-cyan/30 mb-12 text-center">
        <h3 class="text-lg font-bold text-white mb-4"><i class="fa-solid fa-play text-brand-pink mr-2"></i>Präsentation & Demonstration</h3>
        <div class="aspect-video max-w-3xl mx-auto rounded-xl overflow-hidden border border-brand-border">
            <video class="w-full h-full object-cover" controls poster="{{ url_for('static', filename='images/kopffit_preview.jpg') }}">
                <source src="{{ url_for('static', filename='videos/kopffit_projekt_video.mp4') }}" type="video/mp4">
                Ihr Browser unterstützt das Video-Tag leider nicht.
            </video>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex flex-col sm:flex-row gap-6 justify-center items-center">
        <!-- Render Link -->
        <a href="https://kopffit-project.onrender.com" target="_blank" class="px-8 py-4 rounded-xl bg-gradient-to-r from-brand-cyan to-brand-pink text-black font-bold hover:shadow-[0_0_30px_rgba(0,242,254,0.6)] transition-all flex items-center gap-3 text-base">
            <i class="fa-solid fa-rocket"></i> Live-App spielen
        </a>
        <!-- GitHub Link -->
        <a href="https://github.com/rczkr/KopfFit-Project" target="_blank" class="px-8 py-4 rounded-xl glass-card text-white font-semibold hover:border-brand-pink transition-all flex items-center gap-3 text-base border border-brand-border">
            <i class="fa-brands fa-github text-xl"></i> Quellcode auf GitHub
        </a>
    </div>
</section>
{% endblock %}
